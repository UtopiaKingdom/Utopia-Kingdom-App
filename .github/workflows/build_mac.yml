name: Build macOS DMG (unsigned)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        run: npm install --no-fund --no-audit

      - name: Ship public config stub
        run: cp config.ship.json config.json

      - name: Bundle relocatable Python for macOS
        run: node scripts/prepare_mac_python.js

      - name: Packaging guard
        run: node tools/check_packaged_assets.js

      - name: Build unsigned universal DMG
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List dist
        run: ls -lah dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: utopia-kingdom-mac-dmg
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Upload DMG to R2 (site download)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BUILD_OUT_DIR: dist
        run: |
          if [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "R2 secrets not set — skipping upload (artifact still available)."
            exit 0
          fi
          node tools/upload_mac_build_to_r2.js
