<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Kingdom</title>
  <link rel="stylesheet" href="desktop-toast.css" />
</head>
<body>
  <button type="button" class="toast" id="toast" data-side="" aria-live="polite">
    <span class="toast-stripe" aria-hidden="true"></span>
    <span class="toast-logo-wrap" aria-hidden="true">
      <img class="toast-logo" id="toastLogo" src="logo.png" alt="" />
    </span>
    <span class="toast-copy">
      <span class="toast-kicker" id="toastKicker">Utopia Kingdom</span>
      <span class="toast-title" id="toastTitle">Trading signal</span>
      <span class="toast-body" id="toastBody">New signal received</span>
    </span>
    <span class="toast-side" id="toastSide" hidden></span>
    <span class="toast-x" id="toastClose" title="Dismiss" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
        <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </span>
    <span class="toast-bar" id="toastBar" aria-hidden="true"></span>
  </button>
  <script src="desktop-toast-page.js"></script>
</body>
</html>
