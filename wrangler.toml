name = "utopia-kingdom"
account_id = "01c00de65845f2d73d55f1dc6527ba6f"
main = "cloudflare-worker.js"
compatibility_date = "2024-09-02"

routes = [
	{ pattern = "utkingdom.com/*", zone_name = "utkingdom.com" },
	{ pattern = "www.utkingdom.com/*", zone_name = "utkingdom.com" }
]

# Environment variables
[vars]
APP_VERSION = "3.3.24"
FILE_SIZE_BYTES = "224194975"
WS_SERVER_URL = "wss://site-production-24de.up.railway.app"
FILE_DOWNLOAD_URL = "https://utkingdom.com/releases/v3.3.24/Utopia%20Kingdom-Setup-3.3.24.exe"
MAC_FILE_DOWNLOAD_URL = "https://utkingdom.com/releases/v3.3.25/Utopia%20Kingdom-3.3.25-mac.dmg"
ANDROID_DOWNLOAD_URL = "https://utkingdom.com/releases/mobile/UtopiaKingdom-1.2.8.apk"
# Mobile in-app update check (bump when you upload a new APK)
MOBILE_APP_VERSION = "1.2.8"
MOBILE_VERSION_CODE = "30"
MOBILE_RELEASE_NOTES = "History/winrate fixed (Berlin tape), chat join/send fixed, Studio cook matches PC styles."
# iOS skipped — page explains Windows/Android only (no App Store / TestFlight).
IOS_DOWNLOAD_URL = "https://utkingdom.com/ios-install"
# Contabo bot tape HTTP origin (no credentials). Worker proxies GET /api/bot-tape/*
HISTORY_ORIGIN = "http://169.58.151.111:8788"
# (sha512 of full EXE; compute locally if needed)
FILE_SHA512 = "xQtkMZNPCnYN9ISJRdYKlE1RNUGAxU0UDJ+KrstUxWtbdpSaYIGEnd+BY/tMMwI66dIko0TFqgQ2mbO5qQBrjQ=="
PADDLE_DEFAULT_PRICE_ID = "pri_01km1j1mhsbckjb95kxra7qkww"
# Optional: forward POST /webhook to your real Paddle verification backend.
# Example: "https://api.utkingdom.com/webhook"
# PADDLE_WEBHOOK_TARGET = ""

[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "utopia-downloads"
